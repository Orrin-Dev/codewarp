name: Release

# - Push a tag like v0.2.0           -> production release (stable, listed as "Latest")
# - Push to main / master            -> rolling "dev" pre-release, replaced on every push
# - Run it by hand (Actions tab)     -> same as a push to the branch you pick
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Works out the version once, so every build and the release agree on it.
  meta:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      update_url: ${{ steps.version.outputs.update_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: version
        run: |
          base=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=production
            version="${GITHUB_REF_NAME#v}"
            # production builds update from the newest numbered release
            update_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          else
            channel=dev
            version="${base%%-*}-dev.${GITHUB_RUN_NUMBER}"
            # dev builds update from the rolling dev release
            update_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/dev"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "update_url=$update_url" >> "$GITHUB_OUTPUT"
          echo "Building $channel version $version"

  linux:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm # the rpm target needs rpmbuild

      - name: Build the app
        run: npm run build -w @codewarp/desktop

      - name: Check the packaging binary
        run: |
          # electron-builder runs this helper for everything; ENOENT means it is missing or not executable
          B=node_modules/app-builder-bin/linux/x64/app-builder
          ls -la node_modules/app-builder-bin/linux/x64/ || true
          if [ ! -x "$B" ]; then
            echo "app-builder missing or not executable, reinstalling app-builder-bin"
            V=$(node -p "require('app-builder-bin/package.json').version" 2>/dev/null || echo "")
            rm -rf node_modules/app-builder-bin
            HUSKY=0 npm install --no-save --no-package-lock --ignore-scripts "app-builder-bin@${V:-5.0.0-alpha.10}"
            chmod +x "$B" || true
            ls -la node_modules/app-builder-bin/linux/x64/
          fi

      - name: Package (AppImage, deb, rpm)
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          UPDATE_URL: ${{ needs.meta.outputs.update_url }}
          HUSKY: '0' # electron-builder runs npm install, which would otherwise try to set up git hooks
        run: |
          # In a workspace npm installs electron in the root node_modules, where electron-builder does not
          # look, so tell it the exact version that was installed.
          ELECTRON_VERSION=$(node -p "require('electron/package.json').version")
          echo "Packaging with Electron $ELECTRON_VERSION"
          npx electron-builder --linux AppImage deb rpm --publish never \
            --config.electronVersion="$ELECTRON_VERSION" \
            --config.extraMetadata.version="$VERSION" \
            --config.publish.url="$UPDATE_URL"

      - name: Package the collaboration server
        env:
          CODEWARP_VERSION: ${{ needs.meta.outputs.version }}
        run: npm run server:export

      - name: Collect files
        run: |
          mkdir -p out
          cp -v apps/desktop/release/*.AppImage apps/desktop/release/*.deb apps/desktop/release/*.rpm out/
          # the files the app reads to find updates
          cp -v apps/desktop/release/latest-linux.yml out/ || { echo "latest-linux.yml was not produced, so auto update would not work"; exit 1; }
          cp -v packages/server/dist/codewarp-server-*.tar.gz out/
          cp -v packages/server/pterodactyl/egg-codewarp-collab.json out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-files
          path: out/*
          retention-days: 14

  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build the app
        run: npm run build -w @codewarp/desktop

      - name: Package (installer and portable .exe)
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          UPDATE_URL: ${{ needs.meta.outputs.update_url }}
          HUSKY: '0'
        run: |
          ELECTRON_VERSION=$(node -p "require('electron/package.json').version")
          echo "Packaging with Electron $ELECTRON_VERSION"
          npx electron-builder --win nsis portable --x64 --publish never \
            --config.electronVersion="$ELECTRON_VERSION" \
            --config.extraMetadata.version="$VERSION" \
            --config.publish.url="$UPDATE_URL"

      - name: Collect files
        run: |
          mkdir -p out
          cp -v apps/desktop/release/*.exe out/
          cp -v apps/desktop/release/latest.yml out/ || { echo "latest.yml was not produced, so auto update would not work"; exit 1; }
          cp -v apps/desktop/release/*.blockmap out/ || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-files
          path: out/*
          retention-days: 14

  # Puts everything on the Releases page once every build has succeeded.
  publish:
    needs: [meta, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Publish production release
        if: needs.meta.outputs.channel == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # A tag with a dash (v1.0.0-beta.1) is a pre-release.
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber # re-run of a failed build
          else
            gh release create "$TAG" out/* --title "Codewarp $VERSION" --generate-notes "${flags[@]}"
          fi

      - name: Publish dev build
        if: needs.meta.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          subject=$(git log -1 --pretty=%s)
          # Replace the previous dev release (and move its tag) so there is always exactly one.
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev out/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dev build $VERSION" \
            --notes "Automatic build of the latest commit on \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}): ${subject}

          This is an unstable development build. Use a numbered release for everyday use."
