name: Release

# - Push a tag like v0.2.0           -> production release (stable, listed as "Latest")
# - Push to main / master            -> rolling "dev" pre-release, replaced on every push
# - Run it by hand (Actions tab)     -> same as a push to the branch you pick
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          base=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=production
            version="${GITHUB_REF_NAME#v}"
          else
            channel=dev
            version="${base%%-*}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $channel version $version"

      - uses: ./.github/actions/setup

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm # the rpm target needs rpmbuild

      - name: Build the app
        run: npm run build -w @codewarp/desktop

      - name: Package (AppImage, deb, rpm)
        working-directory: apps/desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx electron-builder --linux AppImage deb rpm --publish never --config.extraMetadata.version="$VERSION"

      - name: Collect files
        working-directory: apps/desktop/release
        run: |
          mkdir -p ../../../out
          cp -v *.AppImage *.deb *.rpm ../../../out/
          cd ../../../out
          sha256sum * > SHA256SUMS.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: codewarp-${{ steps.version.outputs.version }}
          path: out/*
          retention-days: 14

      - name: Publish production release
        if: steps.version.outputs.channel == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A tag with a dash (v1.0.0-beta.1) is a pre-release.
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber # re-run of a failed build
          else
            gh release create "$TAG" out/* --title "Codewarp $VERSION" --generate-notes "${flags[@]}"
          fi

      - name: Publish dev build
        if: steps.version.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          subject=$(git log -1 --pretty=%s)
          # Replace the previous dev release (and move its tag) so there is always exactly one.
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev out/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dev build $VERSION" \
            --notes "Automatic build of the latest commit on \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}): ${subject}

          This is an unstable development build. Use a numbered release for everyday use."
