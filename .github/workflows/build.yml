name: Automate NPM Workspace Build

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-desktop:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js runtime environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your preferred Node version (e.g., 18, 20, 22)
          cache: 'npm'       # Automatically caches npm dependencies for faster builds

      # Step 3: Install dependencies for the workspace
      - name: Install Dependencies
        run: npm ci
        env:
          HUSKY: '0'

      # Step 4: Run the specific workspace build command
      - name: Build Desktop Package
        run: npm run build -w @codewarp/desktop
