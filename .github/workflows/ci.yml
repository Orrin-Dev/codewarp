name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, master] # main is covered by the Release workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: npm run typecheck
      - name: Build the app
        run: npm run build
