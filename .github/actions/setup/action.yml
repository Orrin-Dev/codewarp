name: Set up Codewarp
description: Node, dependencies, and the vendored scratch-vm build. Run after actions/checkout.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.cache/electron
          ~/.cache/electron-builder
        key: downloads-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: downloads-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      env:
        HUSKY: '0'
      run: |
        # npm ci needs a committed package-lock.json; fall back to a plain install if there is none yet.
        if [ -f package-lock.json ]; then npm ci; else npm install; fi

    # packages/scratch-vm is vendored source; its dist/ is not committed, so build it here.
    # scratch-vm's webpack config also builds a demo "playground" and copies files for it out of
    # packages/scratch-vm/node_modules. In a workspace those packages live in the root node_modules, so the
    # copy fails and webpack exits with an error even though the library itself built fine. The app only
    # needs the "main" and "browser" files, so ignore webpack's exit code and check those exist instead.
    - name: Build scratch-vm
      shell: bash
      working-directory: packages/scratch-vm
      run: |
        npx webpack || echo "webpack reported errors (expected: playground file copy). Checking the files the app uses."
        node -e "
          const fs = require('fs');
          const pkg = require('./package.json');
          const files = [pkg.main, pkg.browser].filter(f => typeof f === 'string');
          const missing = files.filter(f => !fs.existsSync(f));
          if (files.length === 0 || missing.length) {
            console.error('scratch-vm build is missing: ' + (missing.join(', ') || 'no main/browser in package.json'));
            process.exit(1);
          }
          console.log('scratch-vm build present: ' + files.join(', '));
        "
