<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="210"/></clipPath>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2233"/><stop offset="1" stop-color="#12151f"/></linearGradient>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1017"/><stop offset="1" stop-color="#080a0f"/></linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <!-- left half: stacked code blocks -->
    <rect x="32" y="32" width="480" height="960" fill="url(#bgL)"/>
    <!-- right half: code -->
    <rect x="512" y="32" width="480" height="960" fill="url(#bgR)"/>

    <!-- blocks -->
    <g transform="translate(41 0)">
      <path d="M96 220 h110 l22 24 h64 l22 -24 h50 a34 34 0 0 1 34 34 v96 a34 34 0 0 1 -34 34 h-266 a34 34 0 0 1 -34 -34 v-96 a34 34 0 0 1 34 -34z" fill="#8b7cff"/>
      <path d="M96 400 h110 l22 24 h64 l22 -24 h50 a34 34 0 0 1 34 34 v96 a34 34 0 0 1 -34 34 h-266 a34 34 0 0 1 -34 -34 v-96 a34 34 0 0 1 34 -34z" fill="#2dd4bf"/>
      <path d="M96 580 h110 l22 24 h64 l22 -24 h50 a34 34 0 0 1 34 34 v96 a34 34 0 0 1 -34 34 h-266 a34 34 0 0 1 -34 -34 v-96 a34 34 0 0 1 34 -34z" fill="#fbbf24"/>
      <path d="M96 760 h110 l22 24 h64 l22 -24 h50 a34 34 0 0 1 34 34 v96 a34 34 0 0 1 -34 34 h-266 a34 34 0 0 1 -34 -34 v-96 a34 34 0 0 1 34 -34z" fill="#fb7185"/>
      <g fill="#ffffff" fill-opacity="0.92">
        <rect x="140" y="288" width="150" height="26" rx="13"/><circle cx="346" cy="301" r="20"/>
        <rect x="140" y="468" width="190" height="26" rx="13"/><circle cx="356" cy="481" r="20"/>
        <rect x="140" y="648" width="120" height="26" rx="13"/><circle cx="290" cy="661" r="20"/>
        <rect x="140" y="828" width="170" height="26" rx="13"/>
      </g>
    </g>

    <!-- code -->
    <g style="white-space:pre" xml:space="preserve" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="50" font-weight="700">
      <text x="552" y="270"><tspan fill="#c084fc">class</tspan><tspan fill="#e5e7eb">&#160;</tspan><tspan fill="#5eead4">Warp</tspan></text>
      <text x="552" y="350" fill="#94a3b8">{</text>
      <text x="552" y="450"><tspan fill="#e5e7eb">&#160;&#160;</tspan><tspan fill="#60a5fa">int</tspan><tspan fill="#e5e7eb">&#160;x&#160;=&#160;</tspan><tspan fill="#fbbf24">10</tspan><tspan fill="#94a3b8">;</tspan></text>
      <text x="552" y="550"><tspan fill="#e5e7eb">&#160;&#160;</tspan><tspan fill="#60a5fa">void</tspan><tspan fill="#e5e7eb">&#160;</tspan><tspan fill="#fde68a">Go</tspan><tspan fill="#94a3b8">()</tspan></text>
      <text x="552" y="650"><tspan fill="#e5e7eb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#fde68a">Move</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#e5e7eb">x</tspan><tspan fill="#94a3b8">);</tspan></text>
      <text x="552" y="750"><tspan fill="#e5e7eb">&#160;&#160;</tspan><tspan fill="#fb7185">return</tspan><tspan fill="#94a3b8">;</tspan></text>
      <text x="552" y="850" fill="#94a3b8">}</text>
    </g>

    <!-- seam -->
    <rect x="506" y="32" width="12" height="960" fill="#2dd4bf" fill-opacity="0.85"/>
  </g>
  <rect x="32" y="32" width="960" height="960" rx="210" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
</svg>
